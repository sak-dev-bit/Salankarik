<div class="h-full flex flex-col">
  <!-- Logo Area -->
  <div class="h-16 flex items-center justify-center border-b border-gray-100">
    <img src="/logo.jpeg" alt="SALANKARIK" class="h-10 object-contain mix-blend-multiply" />
  </div>

  <!-- Navigation -->
  <nav class="flex-1 overflow-y-auto py-4">
    <ul class="space-y-1 px-3">
      <li *ngFor="let item of navigation">
        <a [routerLink]="item.route"
           routerLinkActive="bg-[#1E2756] text-white"
           [routerLinkActiveOptions]="{exact: false}"
           #rla="routerLinkActive"
           class="flex items-center justify-between px-3 py-2.5 text-sm font-medium rounded-md transition-colors group"
           [ngClass]="rla.isActive ? 'bg-[#1E2756] text-white' : 'text-gray-700 hover:bg-gray-100'">
           
          <div class="flex items-center">
            <span class="mr-3 h-5 w-5 flex items-center justify-center" [ngClass]="rla.isActive ? 'text-white' : 'text-gray-400 group-hover:text-gray-600'">
              <ng-container *ngComponentOutlet="item.icon"></ng-container>
            </span>
            {{ item.name }}
          </div>

          <span *ngIf="item.badge" 
                class="ml-auto inline-block py-0.5 px-2 text-xs font-semibold rounded-full"
                [ngClass]="rla.isActive ? 'bg-white/20 text-white' : 'bg-[#FFF3E0] text-[#E65100]'">
            {{ item.badge }}
          </span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- BIS Hallmarked Secure Footer -->
  <div class="p-4 border-t border-gray-100">
    <div class="flex items-center p-3 bg-gray-50 rounded-md border border-gray-200">
      <div class="w-8 h-8 rounded-full bg-amber-100 flex items-center justify-center mr-3 flex-shrink-0">
        <span class="text-amber-700 font-bold text-xs">BIS</span>
      </div>
      <div>
        <p class="text-xs font-semibold text-gray-800">BIS Hallmarked</p>
        <p class="text-[10px] text-gray-500">Vault Security Active</p>
      </div>
    </div>
  </div>
</div>
