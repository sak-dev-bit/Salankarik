<div class="h-full px-6 flex items-center justify-between">
  
  <!-- Left: Global Search -->
  <div class="flex-1 flex items-center">
    <div class="max-w-md w-full lg:max-w-xs relative">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
        <svg lucideSearch class="h-4 w-4 text-gray-400"></svg>
      </div>
      <input type="text" placeholder="Search Orders, Products..." 
        class="block w-full pl-10 pr-3 py-2 border border-gray-200 rounded-md leading-5 bg-gray-50 placeholder-gray-500 focus:outline-none focus:placeholder-gray-400 focus:border-[#1E2756] focus:ring-1 focus:ring-[#1E2756] sm:text-sm transition-colors">
    </div>
    
    <!-- Status Indicator -->
    <div class="ml-6 flex items-center space-x-2 hidden md:flex">
      <span class="w-2 h-2 rounded-full bg-green-500"></span>
      <span class="text-xs font-medium text-gray-600">salankarik.com &bull; Live</span>
    </div>
  </div>

  <!-- Right: Tools & Profile -->
  <div class="ml-4 flex items-center space-x-4 md:space-x-6">
    
    <!-- Date -->
    <div class="hidden md:flex items-center text-sm text-gray-600">
      <svg lucideCalendar class="h-4 w-4 mr-2 text-gray-400"></svg>
      Today: {{ currentDate | date:'MMM d, yyyy' }}
    </div>

    <div class="h-5 w-px bg-gray-200 hidden md:block"></div>

    <!-- Notifications -->
    <button class="relative p-1 rounded-full text-gray-400 hover:text-gray-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#1E2756]">
      <span class="absolute top-0 right-0 block h-2 w-2 rounded-full bg-red-400 ring-2 ring-white"></span>
      <svg lucideBell class="h-5 w-5"></svg>
    </button>

    <div class="h-5 w-px bg-gray-200"></div>

    <!-- User Profile & Logout -->
    <div class="flex items-center">
      <div class="flex items-center cursor-pointer">
        <div class="h-8 w-8 rounded-full bg-[#1E2756] text-white flex items-center justify-center font-bold text-sm">
          {{ authService.state().user?.name?.charAt(0) || 'A' }}
        </div>
        <div class="ml-3 hidden md:block">
          <p class="text-sm font-medium text-gray-700">{{ authService.state().user?.name || 'Administrator' }}</p>
          <p class="text-[10px] text-gray-500 font-semibold uppercase">{{ authService.state().user?.role || 'Admin' }}</p>
        </div>
      </div>
      
      <button (click)="logout()" title="Logout" class="ml-4 p-1 rounded-full text-gray-400 hover:text-gray-600 transition-colors">
        <svg lucideLogOut class="h-5 w-5"></svg>
      </button>
    </div>
  </div>
</div>
