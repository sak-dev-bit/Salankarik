<div class="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8 font-sans">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <div class="flex justify-center mb-6">
      <img src="/logo.jpeg" alt="SALANKARIK" class="h-24 object-contain mix-blend-multiply" />
    </div>
    <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
      Admin Portal
    </h2>
    <p class="mt-2 text-center text-sm text-gray-600">
      Sign in to access the dashboard
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10 border border-gray-100">
      
      <div *ngIf="error()" class="mb-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded relative text-sm" role="alert">
        <span class="block sm:inline">{{ error() }}</span>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">
            Email address
          </label>
          <div class="mt-1">
            <input id="email" type="email" formControlName="email" autocomplete="email" required
              class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-[#1E2756] focus:border-[#1E2756] sm:text-sm"
              [ngClass]="{'border-red-300': loginForm.get('email')?.invalid && loginForm.get('email')?.touched}"
            >
          </div>
          <p *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="mt-2 text-sm text-red-600">
            Please enter a valid email address.
          </p>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">
            Password
          </label>
          <div class="mt-1">
            <input id="password" type="password" formControlName="password" autocomplete="current-password" required
              class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-[#1E2756] focus:border-[#1E2756] sm:text-sm"
              [ngClass]="{'border-red-300': loginForm.get('password')?.invalid && loginForm.get('password')?.touched}"
            >
          </div>
        </div>

        <div>
          <button type="submit" [disabled]="loginForm.invalid || isLoading()"
            class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-[#1E2756] hover:bg-[#151c41] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#1E2756] disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
            <ng-container *ngIf="!isLoading()">Sign in</ng-container>
            <ng-container *ngIf="isLoading()">
              <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Signing in...
            </ng-container>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
